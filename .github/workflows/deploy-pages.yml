name: Deploy design preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/policyiq-nz-architecture-iaifgv
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Repo has never had Pages configured; ask the action to create the
          # Pages site itself (build type "workflow") instead of only
          # verifying one already exists - the default (`enablement: false`)
          # 404s on a repo where Pages was never turned on.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
