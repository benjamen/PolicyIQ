name: Run a real crawl + ingest

# Manual only - this hits a real insurer's live website (docs/04-CRAWLER-
# STRATEGY.md's politeness settings apply: ROBOTSTXT_OBEY, low concurrency,
# AutoThrottle). Run one insurer at a time, deliberately, not on a schedule.
on:
  workflow_dispatch:
    inputs:
      insurer:
        description: "Insurer name - must exactly match an entry in workers/crawler/policyiq_crawler/registry.py"
        required: true
        default: "AIA New Zealand"
      product_type:
        description: "Product type tag applied to ingested documents"
        required: false
        default: "life_cover"

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      # Same low-privilege deploy user as deploy-backend.yml - never root,
      # scoped to this project's checkout. See docs/06-DEPLOYMENT-PLAN.md.
      - name: SSH crawl + ingest
        uses: appleboy/ssh-action@v1.2.0
        env:
          INSURER: ${{ inputs.insurer }}
          PRODUCT_TYPE: ${{ inputs.product_type }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INSURER,PRODUCT_TYPE
          # Real evidence 2026-07-29: Asteron Life's site alone had 200+
          # pages within DEPTH_LIMIT and was still crawling past 20 minutes -
          # 30m cut it off mid-run (not mid-crash; it was making real
          # progress). Insurer sites vary a lot in size.
          command_timeout: 60m
          script: |
            set -e
            cd ~/PolicyIQ
            git fetch origin
            git checkout main
            git pull origin main

            # Dockerized (not a bare venv) specifically because Playwright's
            # Chromium needs OS-level shared libraries installed via
            # `playwright install --with-deps`, which needs root - the
            # deploy user deliberately doesn't have broad sudo on this
            # shared VPS (also running Frappe/bench/n8n). Building the image
            # installs those deps inside Docker's isolation instead, so the
            # host itself is never touched. Same prune hygiene as
            # deploy-backend.yml, for the same disk-space reason.
            cd workers/crawler
            docker image prune -af
            docker builder prune -af
            docker build -t policyiq-crawler .

            SLUG=$(echo "$INSURER" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//')
            mkdir -p ../../backend/discovered

            echo "=== crawling: $INSURER ==="
            docker run --rm \
              -e INSURER="$INSURER" \
              -e OUTFILE="/app/discovered/${SLUG}.jsonl" \
              -v "$(pwd)/../../backend/discovered:/app/discovered" \
              policyiq-crawler

            echo "=== discovered documents ==="
            OUTFILE="../../backend/discovered/${SLUG}.jsonl"
            LINES=$(wc -l < "$OUTFILE" 2>/dev/null || echo 0)
            echo "$LINES candidate document(s) found"
            cat "$OUTFILE" 2>/dev/null || true

            cd ../../backend
            echo "=== downloading + OCR + sections (extraction only if LLM_PROVIDER/LLM_KEY are set) ==="
            docker compose exec -T policyiq-backend python -m app.pipeline.run_ingest \
              --input "discovered/${SLUG}.jsonl" --product-type "$PRODUCT_TYPE"
